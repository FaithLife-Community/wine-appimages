name: Build Wine AppImage

# Builds Wine from a branch of a Wine git repository (by default a patch branch of
# FaithLife-Community/wine), wraps it into an AppImage plus a plain "bundled" tarball,
# and uploads both to a DRAFT release. A maintainer publishes it after testing.
#
# release_type decides which branch may be built and how the build is named
# (see docs/building.md):
#   release     oinos-master only      11.21-oinos, 11.21-oinos-2, ...  (OuDedetai's Recommended)
#   prerelease  oinos-prerelease only  11.21-oinos-pre-<commit>         (OuDedetai's beta)
#   draft       any branch             11.21-<topic>-<commit>           (for testing)
#
# Prerequisite: a successful "Bootstraps CI" run in this repository within the last
# 90 days (its artifact holds the Ubuntu chroots Wine is compiled in).

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "release (from oinos-master), prerelease (from oinos-prerelease) or draft (any branch)"
        type: choice
        options: [draft, prerelease, release]
        default: draft
        required: true
      wine_repo:
        description: "Git URL of the Wine source"
        default: "https://github.com/FaithLife-Community/wine.git"
        required: true
      wine_branch:
        description: "Branch or tag to build; empty = the branch for the release type (drafts must name one)"
        default: ""
        required: false
      label:
        description: "Optional name override, no hyphens; empty = oinos, or the topic for drafts (oinos-testing/media gives media)"
        default: ""
        required: false
      wine_version:
        description: "Version for the file names; empty = the VERSION of the branch"
        default: ""
        required: false
      bootstraps_run:
        description: "Bootstraps CI run id to take the chroots from; empty = the latest successful run"
        default: ""
        required: false
      dxvk_ref:
        description: "FaithLife-Community/dxvk branch, tag or commit to bundle (run '<AppImage> dxvk-install'); empty = no DXVK"
        default: "logos/combined"
        required: false

permissions:
  contents: write   # publish the release
  actions: read     # download the Bootstraps artifact from another workflow run

concurrency:
  group: build-${{ inputs.release_type }}-${{ inputs.wine_branch }}-${{ inputs.label }}
  cancel-in-progress: false

jobs:
  wine:
    name: Compile Wine
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    outputs:
      tarball: ${{ steps.build.outputs.tarball }}
      version: ${{ steps.build.outputs.version }}
      branch: ${{ steps.plan.outputs.branch }}
      commit: ${{ steps.plan.outputs.commit }}
      label: ${{ steps.plan.outputs.label }}
      suffix: ${{ steps.plan.outputs.suffix }}

    steps:
      - name: Check the branch and work out the name
        id: plan
        env:
          IN_TYPE: ${{ inputs.release_type }}
          IN_WINE_REPO: ${{ inputs.wine_repo }}
          IN_WINE_BRANCH: ${{ inputs.wine_branch }}
          IN_LABEL: ${{ inputs.label }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          case "$IN_TYPE" in
            release)    want=oinos-master ;;
            prerelease) want=oinos-prerelease ;;
            draft)      want= ;;
            *)          fail "unknown release_type '$IN_TYPE'" ;;
          esac
          branch="${IN_WINE_BRANCH:-$want}"
          [ -n "$branch" ] || fail "a draft needs wine_branch"
          if [ -n "$want" ]; then
            [ "$branch" = "$want" ] || fail "a $IN_TYPE is built only from $want, not $branch"
            case "${IN_WINE_REPO%.git}" in
              https://github.com/FaithLife-Community/wine) ;;
              *) fail "a $IN_TYPE is built only from https://github.com/FaithLife-Community/wine.git" ;;
            esac
          fi
          commit=$(git ls-remote "$IN_WINE_REPO" "refs/heads/$branch" "refs/tags/$branch" | head -n1 | cut -f1)
          [ -n "$commit" ] || fail "no branch or tag '$branch' in $IN_WINE_REPO"
          short=$(printf '%s' "$commit" | cut -c1-7)

          # The AppImage is named wine-custom_<version>_<label><suffix>-<arch>.AppImage.
          # OuDedetai reads the Wine version from between the first two hyphens
          # (custom_11.21_<label>), so the label itself must not contain hyphens;
          # the suffix may.
          if [ -n "$IN_LABEL" ]; then
            label="$IN_LABEL"
          elif [ "$IN_TYPE" = draft ]; then
            label=$(printf '%s' "${branch##*/}" | tr -cd 'A-Za-z0-9.')
            [ -n "$label" ] || label=build
          else
            label=oinos
          fi
          printf '%s' "$label" | grep -Eq '^[A-Za-z0-9._]+$' \
            || fail "label must contain only letters, digits, dots and underscores (no hyphens)"
          case "$IN_TYPE" in
            release)    suffix= ;;   # a free -2, -3, ... is added when releasing, if needed
            prerelease) suffix="-pre-$short" ;;
            draft)      suffix="-$short" ;;
          esac
          {
            echo "branch=$branch"
            echo "commit=$commit"
            echo "label=$label"
            echo "suffix=$suffix"
          } >> "$GITHUB_OUTPUT"
          echo "Building a $IN_TYPE from $branch ($short), named $label$suffix"

      - uses: actions/checkout@v4

      - name: Download bootstraps artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: bootstraps.yml
          workflow_conclusion: success
          run_id: ${{ inputs.bootstraps_run }}
          name: Bootstraps
          path: /opt/Bootstraps

      # Keep the compiler cache between runs, so a rebuild only recompiles what changed.
      # Each run saves a new entry; restore-keys picks the newest one for this branch,
      # then the newest for any branch.
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ steps.plan.outputs.branch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ steps.plan.outputs.branch }}-
            ccache-

      - name: Build Wine
        id: build
        env:
          # Inputs are passed through the environment, never interpolated into the script.
          IN_WINE_REPO: ${{ inputs.wine_repo }}
          IN_WINE_BRANCH: ${{ steps.plan.outputs.branch }}
          IN_LABEL: ${{ steps.plan.outputs.label }}
          IN_WINE_VERSION: ${{ inputs.wine_version }}
        run: |
          sudo apt update
          sudo apt install binutils-mingw-w64-i686 binutils-mingw-w64-x86-64 debootstrap perl git wget xz-utils bubblewrap autoconf patchelf
          sudo tar -C /opt -xpf /opt/Bootstraps/bootstraps.tar.xz
          export EXPERIMENTAL_WOW64="true"
          export USE_CCACHE="true"
          export CCACHE_DIR="$HOME/.cache/ccache"
          export CUSTOM_SRC_PATH="$IN_WINE_REPO"
          export CUSTOM_SRC_BRANCH="$IN_WINE_BRANCH"
          export CUSTOM_BUILD_LABEL="$IN_LABEL"
          WINE_BRANCH=vanilla ./build/build_wine.sh

          f=$(ls build/wine-*-custom-"$IN_LABEL"-amd64.tar.xz)
          version=$(basename "$f" | sed -E 's/^wine-(.*)-custom-.*$/\1/')
          [ -n "$IN_WINE_VERSION" ] && version="$IN_WINE_VERSION"
          echo "tarball=$(basename "$f")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l "$f"; sha256sum "$f"
          /opt/chroots/bionic64_chroot/usr/local/bin/ccache -s 2>/dev/null || true

      - name: Report size and glibc requirement
        env:
          TARBALL: build/${{ steps.build.outputs.tarball }}
          IN_WINE_REPO: ${{ inputs.wine_repo }}
          IN_WINE_BRANCH: ${{ steps.plan.outputs.branch }}
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          d=$(mktemp -d)
          tar -C "$d" -xf "$TARBALL"
          w=$(echo "$d"/wine-*)
          need=$(objdump -T "$w"/bin/wineserver "$w"/lib/wine/x86_64-unix/ntdll.so 2>/dev/null \
                   | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          {
            echo "### $(basename "$TARBALL")"
            echo "- source: \`$IN_WINE_REPO\` branch \`$IN_WINE_BRANCH\` (\`$(printf '%s' "$COMMIT" | cut -c1-12)\`)"
            echo "- tarball: $(du -h "$TARBALL" | cut -f1), unpacked: $(du -sh "$w" | cut -f1)"
            echo "- newest glibc symbol needed by wineserver/ntdll.so: ${need:-unknown}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: wine-tarball
          path: build/${{ steps.build.outputs.tarball }}
          compression-level: 0   # already xz-compressed
          retention-days: 30

  # Our DXVK, built as the fork's own "Artifacts (Package)" workflow does, to bundle in
  # the AppImage under opt/dxvk. It isn't installed into prefixes by itself: that takes
  # "<AppImage> dxvk-install" (appimage/dxvk-install).
  dxvk:
    name: Build DXVK
    if: inputs.dxvk_ref != ''
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Prerequisites
        run: |
          pacman -Syu --needed --noconfirm git meson mingw-w64-gcc glslang
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          repository: FaithLife-Community/dxvk
          ref: ${{ inputs.dxvk_ref }}
          submodules: recursive
          fetch-depth: 0
          path: dxvk

      - name: Build
        id: build
        env:
          IN_REF: ${{ inputs.dxvk_ref }}
        run: |
          cd dxvk
          commit=$(git rev-parse --short=12 HEAD)
          base=$(git describe --tags --abbrev=0 2>/dev/null || echo unknown)
          version="${IN_REF##*/}-${commit}"
          ./package-release.sh "$version" ../dxvk-out --no-package
          out="../dxvk-out/dxvk-$version"
          cp LICENSE "$out/LICENSE"
          printf 'DXVK %s (FaithLife-Community/dxvk %s, commit %s, based on %s)\n' \
            "$version" "$IN_REF" "$(git rev-parse HEAD)" "$base" > "$out/VERSION"
          cat "$out/VERSION"; ls -R "$out" | head -20
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mv "$out" ../dxvk-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: dxvk
          path: dxvk-bundle
          retention-days: 30

  appimage:
    name: Package AppImage and release
    needs: [wine, dxvk]
    # Runs without DXVK too (dxvk_ref empty skips that job).
    if: ${{ !cancelled() && needs.wine.result == 'success' && (needs.dxvk.result == 'success' || needs.dxvk.result == 'skipped') }}
    # Pinned: appimage-builder 1.0.3 drives the host's apt, and this job failed within
    # seconds once ubuntu-latest started moving to Ubuntu 26.04 (October 2026; its apt 3
    # dropped apt-key). The recipe was proven on 24.04. Revisit when 24.04 is retired.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wine-tarball
          path: wine-tarball

      - uses: actions/download-artifact@v4
        if: needs.dxvk.result == 'success'
        with:
          name: dxvk
          path: dxvk-bundle

      - name: Prerequisites
        run: |
          wget -q "https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.0.3/appimage-builder-1.0.3-x86_64.AppImage" -O appimage-builder
          chmod +x appimage-builder
          ./appimage-builder --appimage-extract &>/dev/null
          sudo wget -q https://github.com/pkgforge-dev/appimagetool-uruntime/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
          sudo mkdir -p /usr/share/icons/hicolor/scalable/
          sudo cp appimage/wine.svg /usr/share/icons/hicolor/scalable/

      - name: Choose the release tag
        id: name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_TYPE: ${{ inputs.release_type }}
          VERSION: ${{ needs.wine.outputs.version }}
          LABEL: ${{ needs.wine.outputs.label }}
          SUFFIX: ${{ needs.wine.outputs.suffix }}
        run: |
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
                        --jq '.[] | select(.draft | not) | .tag_name')
          tag="${VERSION}-${LABEL}${SUFFIX}"
          if [ "$IN_TYPE" = release ]; then
            # Published releases are never replaced: the next stable release on the
            # same Wine version becomes <version>-oinos-2, then -3, ...
            n=1
            while printf '%s\n' "$published" | grep -qxF "$tag"; do
              n=$((n + 1))
              tag="${VERSION}-${LABEL}-$n"
            done
          fi
          rest="${tag#"${VERSION}-${LABEL}"}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=wine-custom_${VERSION}_${LABEL}${rest}-$(uname -m)" >> "$GITHUB_OUTPUT"
          echo "wine_ver=custom_${VERSION}_${LABEL}${rest}" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Build AppImage
        env:
          TARBALL_NAME: ${{ needs.wine.outputs.tarball }}
          NAME: ${{ steps.name.outputs.name }}
          WINE_VER: ${{ steps.name.outputs.wine_ver }}
        run: |
          export WINE_TARBALL="$PWD/wine-tarball/$TARBALL_NAME"
          export WINE_VER
          name="$NAME"
          mkdir -p out
          (cd appimage && ../squashfs-root/AppRun --skip-appimage --recipe recipe.yml)

          # Our DXVK, and the commands that put it into a prefix and take it out again.
          if [ -d dxvk-bundle/x64 ]; then
            cp -a dxvk-bundle appimage/AppDir/opt/dxvk
            install -m 755 appimage/dxvk-install appimage/dxvk-uninstall appimage/AppDir/bin/
            echo "Bundled $(cat appimage/AppDir/opt/dxvk/VERSION)"
          fi

          export ARCH="$(uname -m)"
          export APPIMAGE_EXTRACT_AND_RUN=1
          export URUNTIME_PRELOAD=0
          appimagetool --no-appstream appimage/AppDir "out/$name.AppImage"

          # The same AppDir as a plain tarball, for distros that dislike AppImages.
          # Unpack anywhere and run ./<dir>/AppRun (it needs no FUSE and no installation).
          # Named "<name>.bundle.tar.xz" so it sorts after "<name>.AppImage": GitHub lists a
          # release's assets by name, and OuDedetai downloads the first one.
          cp -a appimage/AppDir "$name.bundle"
          tar -cf - "$name.bundle" | xz -T0 -9 > "out/$name.bundle.tar.xz"
          ls -l out

      - name: Report size and glibc requirement
        run: |
          f=$(ls out/*.AppImage)
          chmod +x "$f"
          d=$(mktemp -d)
          (cd "$d" && APPIMAGE_EXTRACT_AND_RUN=1 "$OLDPWD/$f" --appimage-extract >/dev/null 2>&1)
          w="$d/squashfs-root/opt/wine-devel"
          need=$(objdump -T "$w"/bin/wineserver "$w"/lib/wine/x86_64-unix/ntdll.so 2>/dev/null \
                   | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
          {
            echo "### $(basename "$f")"
            echo "- AppImage: $(du -h "$f" | cut -f1), unpacked: $(du -sh "$d/squashfs-root" | cut -f1)"
            echo "- newest glibc symbol needed by wineserver/ntdll.so: ${need:-unknown}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_TYPE: ${{ inputs.release_type }}
          IN_WINE_REPO: ${{ inputs.wine_repo }}
          IN_DXVK_REF: ${{ inputs.dxvk_ref }}
          DXVK_VERSION: ${{ needs.dxvk.outputs.version }}
          BRANCH: ${{ needs.wine.outputs.branch }}
          COMMIT: ${{ needs.wine.outputs.commit }}
          VERSION: ${{ needs.wine.outputs.version }}
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          tag="$TAG"
          short=$(printf '%s' "$COMMIT" | cut -c1-12)
          case "$IN_TYPE" in
            release)
              title="Wine ${VERSION} AppImage (${tag#"${VERSION}-"})"
              prerelease=
              what="Stable build" ;;
            prerelease)
              title="Wine ${VERSION} AppImage prerelease (${tag#"${VERSION}-"})"
              prerelease=--prerelease
              what="Prerelease (beta) build" ;;
            *)
              title="Wine ${VERSION} AppImage test build (${tag#"${VERSION}-"})"
              prerelease=--prerelease
              what="Untested build" ;;
          esac
          notes="${what} of Wine ${VERSION} from ${IN_WINE_REPO} branch ${BRANCH} (commit ${short}).
          The AppImage, plus a tarball of the same bundled folder for systems without FUSE.
          See docs/building.md for testing and publishing."
          if [ -n "$DXVK_VERSION" ]; then
            notes="${notes}

          Bundles DXVK ${DXVK_VERSION} (FaithLife-Community/dxvk ${IN_DXVK_REF}), not installed by default:
          WINEPREFIX=<prefix> ./<AppImage> dxvk-install (and dxvk-uninstall). Needs a Vulkan 1.4 driver."
          fi
          # Only replace an earlier build with this tag while it is still a draft. A published
          # release may be what OuDedetai is offering users right now, so never delete it.
          # A draft has no git tag yet, so delete it by id: "gh release delete --cleanup-tag"
          # can fail trying to remove the missing tag (the likely cause of run 41147560589 failing).
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
                       --jq ".[] | select(.tag_name == \"$tag\") | \"\\(.id) \\(.draft)\"")
          while read -r id draft; do
            [ -z "$id" ] && continue
            if [ "$draft" = "true" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              echo "Replaced earlier draft $tag (release id $id)"
            else
              echo "::error::release $tag is already published; choose a new label (published releases are never replaced)"
              exit 1
            fi
          done <<< "$existing"
          # A draft: OuDedetai offers the newest prerelease as its beta and the newest full
          # release to everyone, so nothing becomes visible until a maintainer publishes it.
          # A release-type build is created without the prerelease flag, so publishing the
          # draft makes it a full release; drafts of other types publish as prereleases.
          # OuDedetai downloads the FIRST asset. GitHub orders assets by name, not upload
          # order, which the file names above take care of; the check below confirms it.
          gh release create "$tag" --draft $prerelease --target "$GITHUB_SHA" \
            --title "$title" --notes "$notes" \
            --repo "$GITHUB_REPOSITORY" out/*.AppImage
          gh release upload "$tag" out/*.bundle.tar.xz --repo "$GITHUB_REPOSITORY"
          first=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\") | .assets[0].name")
          case "$first" in
            *.AppImage) echo "First asset: $first" ;;
            *) echo "::error::first asset is '$first', not the AppImage; OuDedetai would download the wrong file"; exit 1 ;;
          esac
